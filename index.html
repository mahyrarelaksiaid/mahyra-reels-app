<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF6FE">
<title>Mahyra Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#12355B;--sky:#4FB3F0;--sky2:#2B8BD6;--ink:#0B1F33;--line:#D7E9F7;--mut:#5B7491;--bad:#C0392B}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:radial-gradient(900px 420px at 80% -10%,#D5ECFC 0%,rgba(213,236,252,0) 60%),linear-gradient(180deg,#EAF6FE 0%,#F7FCFF 100%) fixed}
main{max-width:440px;margin:0 auto;padding:48px 16px}
.logo{display:block;height:72px;margin:0 auto 12px}
h1{font-size:24px;font-weight:800;text-align:center;color:var(--navy);margin:0 0 4px;letter-spacing:-.01em}
p.s{text-align:center;color:var(--mut);margin:0 0 22px;font-size:13.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(18,53,91,.05),0 12px 30px rgba(18,53,91,.08)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#2A4A6B}
input{width:100%;font:inherit;color:var(--ink);background:#F3FAFF;border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
input:focus{outline:none;border-color:var(--sky);background:#fff;box-shadow:0 0 0 4px rgba(79,179,240,.18)}
button{font:inherit;width:100%;margin-top:18px;min-height:50px;border-radius:12px;border:0;color:#fff;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--sky2),var(--sky));box-shadow:0 8px 20px rgba(43,139,214,.28)}
.err{color:var(--bad);font-size:13px;margin:10px 0 0}
.hint{color:var(--mut);font-size:13px;margin:14px 0 0}
a{color:var(--sky2);font-weight:600}
</style>
</head>
<body>
<main id="boot">
  <img class="logo" src="logo.png" alt="" onerror="this.remove()">
  <h1>Mahyra Reels</h1>
  <p class="s" id="status">Memuat…</p>
  <div class="card" id="form" hidden>
    <label for="repo">Repo GitHub</label>
    <input id="repo" type="text" autocapitalize="off" spellcheck="false">
    <label for="token">Token GitHub</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <button id="go">Simpan &amp; buka</button>
    <p class="err" id="err"></p>
    <p class="hint">Token hanya disimpan di browser ini dan hanya dikirim ke api.github.com. Cara membuat token:
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>
      → hanya repo Anda, izin <i>Actions</i>, <i>Contents</i>, <i>Workflows</i> = Read and write.</p>
  </div>
</main>
<script>
(() => {
"use strict";
/* Halaman pembuka: mengambil web tool TERBARU dari repo privat, lalu menjalankannya.
   Halaman ini tidak berisi rahasia dan hampir tidak pernah perlu diperbarui. */
const DEFAULT_REPO = "mahyrarelaksiaid/mahyra-reels", APP_PATH = "web/index.html";
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const $ = id => document.getElementById(id);
function showForm(msg) {
  $("status").textContent = "Masukkan token GitHub untuk membuka web tool.";
  $("form").hidden = false; $("repo").value = store.get("repo", DEFAULT_REPO); $("token").value = store.get("token");
  $("err").textContent = msg || "";
}
async function boot() {
  // Kode web tool selalu diambil dari repo utama; repo usaha yang dipilih (Mahyra / mesin cuci / ...) dipakai untuk data.
  const token = store.get("token"), repo = store.get("app_repo", DEFAULT_REPO);
  if (!token) return showForm();
  $("status").textContent = "Memuat versi terbaru…";
  let html = null, authFail = false;
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${APP_PATH}?ref=main`, {
      cache: "no-store",
      headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" } });
    if (r.status === 401) { authFail = true; throw new Error("Token ditolak atau kedaluwarsa. Buat token baru."); }
    if (!r.ok) throw new Error(`GitHub membalas ${r.status}. Cek nama repo dan izin token.`);
    html = await r.text();
    if (!/<title>Mahyra Reels<\/title>/.test(html)) throw new Error("File web tool di repo tidak dikenali.");
    store.set("app_cache", html);
  } catch (e) {
    if (authFail) return showForm(e.message);
    html = store.get("app_cache");            // tanpa internet / GitHub bermasalah -> pakai salinan terakhir
    if (!html) return showForm(e.message);
  }
  document.open(); document.write(html); document.close();
}
$("go").addEventListener("click", () => {
  const repo = $("repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
  const token = $("token").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return ($("err").textContent = "Isi repo seperti: pemilik/nama-repo");
  if (!token) return ($("err").textContent = "Token belum diisi.");
  store.set("repo", repo); store.set("token", token); $("form").hidden = true; boot();
});
boot();
})();
</script>
</body>
</html>
